[project]
name = "network-compass-api"
version = "0.1.0"
description = "Network Compass FastAPI application foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "fastapi==0.139.2",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.51",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "httpx2==2.7.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
exclude = ["migrations"]
python_version = "3.13"
strict = true
